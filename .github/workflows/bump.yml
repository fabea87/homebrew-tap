name: bump betterbird

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bump-betterbird
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate cask from the current release
        run: bash scripts/bump-betterbird.sh

      - name: Commit and push if the version moved
        run: |
          if git diff --quiet -- Casks/betterbird.rb; then
            echo "already current"
            exit 0
          fi
          version=$(sed -nE 's/^  version "([^"]+)".*/\1/p' Casks/betterbird.rb)
          git config user.name  fabea87
          git config user.email 30454568+fabea87@users.noreply.github.com
          git commit -am "betterbird ${version}"
          git push
